<rect x="420" y="30" width="680" height="95" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="59.0" text-anchor="middle" dominant-baseline="central">Block 输入 x</text>
<text x="760.0" y="96.0" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
<rect x="420" y="175" width="680" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="205.5" text-anchor="middle" dominant-baseline="central">ln1: LayerNorm(128)</text>
<text x="760.0" y="242.5" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
<text x="760.0" y="279.5" text-anchor="middle" dominant-baseline="central">每个位置独立归一化</text>
<rect x="40" y="370" width="430" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="255.0" y="400.5" text-anchor="middle" dominant-baseline="central">Linear(128,32)，无 bias</text>
<text x="255.0" y="437.5" text-anchor="middle" dominant-baseline="central">Q: [B,T,32]</text>
<text x="255.0" y="474.5" text-anchor="middle" dominant-baseline="central">用于查询上下文</text>
<rect x="545" y="370" width="430" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="400.5" text-anchor="middle" dominant-baseline="central">Linear(128,32)，无 bias</text>
<text x="760.0" y="437.5" text-anchor="middle" dominant-baseline="central">K: [B,T,32]</text>
<text x="760.0" y="474.5" text-anchor="middle" dominant-baseline="central">用于与 query 匹配</text>
<rect x="1050" y="370" width="430" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="1265.0" y="400.5" text-anchor="middle" dominant-baseline="central">Linear(128,32)，无 bias</text>
<text x="1265.0" y="437.5" text-anchor="middle" dominant-baseline="central">V: [B,T,32]</text>
<text x="1265.0" y="474.5" text-anchor="middle" dominant-baseline="central">待聚合的信息</text>
<rect x="420" y="565" width="680" height="95" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="594.0" text-anchor="middle" dominant-baseline="central">K.transpose(-2,-1)</text>
<text x="760.0" y="631.0" text-anchor="middle" dominant-baseline="central">[B,32,T]</text>
<rect x="370" y="720" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="750.5" text-anchor="middle" dominant-baseline="central">Q @ K转置 / sqrt(32)</text>
<text x="760.0" y="787.5" text-anchor="middle" dominant-baseline="central">[B,T,T]</text>
<text x="760.0" y="824.5" text-anchor="middle" dominant-baseline="central">每个 query 对各个 key 的分数</text>
<rect x="370" y="915" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="945.5" text-anchor="middle" dominant-baseline="central">因果 mask: [T,T]，沿 B 广播</text>
<text x="760.0" y="982.5" text-anchor="middle" dominant-baseline="central">未来位置填为负无穷</text>
<text x="760.0" y="1019.5" text-anchor="middle" dominant-baseline="central">分数仍为 [B,T,T]</text>
<rect x="370" y="1110" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="1140.5" text-anchor="middle" dominant-baseline="central">softmax(dim=-1)</text>
<text x="760.0" y="1177.5" text-anchor="middle" dominant-baseline="central">[B,T,T]</text>
<text x="760.0" y="1214.5" text-anchor="middle" dominant-baseline="central">对每个 query 的 key 分数归一化</text>
<rect x="370" y="1305" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="1335.5" text-anchor="middle" dominant-baseline="central">attention dropout</text>
<text x="760.0" y="1372.5" text-anchor="middle" dominant-baseline="central">[B,T,T]</text>
<text x="760.0" y="1409.5" text-anchor="middle" dominant-baseline="central">训练 p=0.1，eval 时关闭</text>
<rect x="370" y="1500" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="1530.5" text-anchor="middle" dominant-baseline="central">attention weights @ V</text>
<text x="760.0" y="1567.5" text-anchor="middle" dominant-baseline="central">[B,T,T] @ [B,T,32]</text>
<text x="760.0" y="1604.5" text-anchor="middle" dominant-baseline="central">单头输出 [B,T,32]</text>
<rect x="370" y="1695" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="1725.5" text-anchor="middle" dominant-baseline="central">4 个独立 head 并行</text>
<text x="760.0" y="1762.5" text-anchor="middle" dominant-baseline="central">沿最后一维 concat</text>
<text x="760.0" y="1799.5" text-anchor="middle" dominant-baseline="central">[B,T,4×32] = [B,T,128]</text>
<rect x="370" y="1890" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="1920.5" text-anchor="middle" dominant-baseline="central">proj: Linear(128,128) + dropout</text>
<text x="760.0" y="1957.5" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
<text x="760.0" y="1994.5" text-anchor="middle" dominant-baseline="central">混合不同 head 的结果</text>
<rect x="370" y="2085" width="780" height="135" rx="8" fill="#eef4f8" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="2115.5" text-anchor="middle" dominant-baseline="central">第一次残差相加</text>
<text x="760.0" y="2152.5" text-anchor="middle" dominant-baseline="central">x1 = x + attention_output</text>
<text x="760.0" y="2189.5" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
<rect x="370" y="2280" width="780" height="95" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="2309.0" text-anchor="middle" dominant-baseline="central">ln2: LayerNorm(128)</text>
<text x="760.0" y="2346.0" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
<rect x="370" y="2435" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="2465.5" text-anchor="middle" dominant-baseline="central">Linear(128,512)</text>
<text x="760.0" y="2502.5" text-anchor="middle" dominant-baseline="central">[B,T,512]</text>
<text x="760.0" y="2539.5" text-anchor="middle" dominant-baseline="central">扩展每个位置的特征维度</text>
<rect x="370" y="2630" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="2660.5" text-anchor="middle" dominant-baseline="central">ReLU</text>
<text x="760.0" y="2697.5" text-anchor="middle" dominant-baseline="central">[B,T,512]</text>
<text x="760.0" y="2734.5" text-anchor="middle" dominant-baseline="central">引入非线性</text>
<rect x="370" y="2825" width="780" height="135" rx="8" fill="#fafbfc" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="2855.5" text-anchor="middle" dominant-baseline="central">Linear(512,128) + dropout</text>
<text x="760.0" y="2892.5" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
<text x="760.0" y="2929.5" text-anchor="middle" dominant-baseline="central">映射回模型宽度</text>
<rect x="370" y="3020" width="780" height="135" rx="8" fill="#eef4f8" stroke="#647888" stroke-width="2"/>
<text x="760.0" y="3050.5" text-anchor="middle" dominant-baseline="central">第二次残差相加</text>
<text x="760.0" y="3087.5" text-anchor="middle" dominant-baseline="central">output = x1 + FFN_output</text>
<text x="760.0" y="3124.5" text-anchor="middle" dominant-baseline="central">[B,T,128]</text>
</g></svg>
